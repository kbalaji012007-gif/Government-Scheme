services:
  - type: web
    name: ruralconnect-karnataka-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: FIREBASE_PROJECT_ID
        value: ruralconnect-karnataka
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: http://localhost:5173
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
